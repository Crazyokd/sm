[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-resource-manager"
version = "0.1.0"
description = "Local Codex and Kimi resource management"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "jinja2", "tomlkit", "markdown-it-py"]

[project.optional-dependencies]
test = ["pytest", "httpx2"]

[project.scripts]
sm = "sm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sm = ["templates/*.html", "static/*", "systemd/*", "prompts/*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
