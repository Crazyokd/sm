workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - check

rust:
  stage: check
  image: nexus3.sr/library/rust:1.88-bookworm
  tags:
    - docker-cicd
    - many-cores
  timeout: 30m
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: always
    CARGO_BUILD_JOBS: "4"
    RUSTUP_DIST_SERVER: "https://rsproxy.cn"
  cache:
    key:
      prefix: rust-1.88
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - target/debug/
  before_script:
    - sed -i 's|http://deb.debian.org|http://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/debian.sources
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git systemd nodejs python3
    - mkdir -p "$CARGO_HOME"
    - |
      cat > "$CARGO_HOME/config.toml" <<'EOF'
      [source.crates-io]
      replace-with = "rsproxy-sparse"
      [source.rsproxy-sparse]
      registry = "sparse+https://rsproxy.cn/index/"
      EOF
    - rustup component add rustfmt clippy
  script:
    - python3 tests/test_hindsight_codex.py
    - python3 tests/test_app_checks.py
    - python3 tests/test_simenv_replay_video.py
    - cargo fmt --check
    - cargo clippy --all-targets --locked -- -D warnings
    - cargo test --locked
    - cargo build --release --locked --bin sm
    - target/release/sm --version
  artifacts:
    paths:
      - target/release/sm
    expire_in: 7 days

typescript:
  stage: check
  image: nexus3.sr/library/node:24-bookworm-slim
  tags:
    - docker-cicd
    - few-cores
  timeout: 10m
  cache:
    key:
      prefix: node-24
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - sed -i 's|http://deb.debian.org|http://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/debian.sources
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git
  script:
    - npm ci --ignore-scripts --cache .npm --prefer-offline --registry http://nexus3.sr/repository/npm-group/ --loglevel=info
    - npm run check
    - npm run build
    - git diff --exit-code -- assets/static/app.js
    - git diff --exit-code -- resources/source-providers/native-plugins.js
    - node_modules/.bin/tsc -p tsconfig.browser.json --noEmit
