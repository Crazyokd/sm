# retained local configuration
default_model="existing-model"
[[hooks]]
event = "SessionStart"
command = "/legacy/repo/.venv/bin/sm record --agent kimi --state-dir /legacy/state"
timeout = 2

[[hooks]]
event = "UserPromptSubmit"
command = "/legacy/repo/.venv/bin/sm record --agent kimi --state-dir /legacy/state"
timeout = 2

[[hooks]]
event = "PostToolUse"
command = "/legacy/repo/.venv/bin/sm record --agent kimi --state-dir /legacy/state"
timeout = 2

[[hooks]]
event = "Stop"
command = "/legacy/repo/.venv/bin/sm record --agent kimi --state-dir /legacy/state"
timeout = 2
