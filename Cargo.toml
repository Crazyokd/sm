[package]
name = "sm-resource-manager"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Local AI resource management and reviewed improvements"

[lib]
name = "sm"

[[bin]]
name = "sm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8.8"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
nix = { version = "0.30", features = ["signal", "process", "fs", "poll"] }
minijinja = { version = "2", features = ["json"] }
pulldown-cmark = "0.13"
regex = "1.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml_edit = { version = "0.23", features = ["serde"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
